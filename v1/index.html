<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuakeSound v1 — Last Hour</title>
  <meta name="description" content="Archived v1 of QuakeSound. A light map and a single tone for each earthquake in the past hour."/>
  <meta name="author" content="Alex Amor">
  <meta name="robots" content="noindex">
  <script type="speculationrules">
    {
      "prerender": [
        { "source": "list", "urls": ["/v1/allday/", "/v1/"] }
      ]
    }
  </script>
  <link rel="icon" href="../favicon.png" type="image/png"/>
  <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin>
  <link rel="preconnect" href="https://earthquake.usgs.gov" crossorigin>
  <link rel="preload" href="css/styles.css" as="style">
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></noscript>
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script" crossorigin="anonymous">
  <link rel="preload" href="https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json" as="fetch" crossorigin="anonymous">
  <link rel="modulepreload" href="js/quakeManager.js">
  <link rel="modulepreload" href="js/soundEngine.js">
</head>
<body data-mode="hour">
  <div id="logo-overlay">
    <a href="/v1/" aria-label="QuakeSound v1 home">
      <img src="./images/quakesound-logo.jpg" alt="QuakeSound Logo" />
    </a>
  </div>
  <div id="map"></div>
  <div id="key-box">
    <div class="key-title">🎵 QuakeSound Key <span class="note">(click page for sound...and wait)</span></div>
    <ul class="key-items">
      <li><strong>Pitch</strong> = Magnitude <span class="note">(higher note, bigger quake)</span></li>
      <li><strong>Note length</strong> = Depth <span class="note">(longer note, shallower quake)</span></li>
      <li><strong>USGS Earthquake Feed</strong>: <span class="feed-source nav-toggle"><a href="/v1/" class="usgs-link" aria-label="Last Hour Earthquakes">Last Hour</a><a href="/v1/allday/" class="usgs-link" aria-label="Past Day Earthquakes">Past Day</a></span></li>
      <li><a href="/" class="archive-home">Current version</a></li>
    </ul>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script type="module" src="js/map.js"></script>
</body>
</html>
