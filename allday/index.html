<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QuakeSound All Day - Global Earthquake Sound Map</title>
  <meta name="description" content="QuakeSound All Day is a musical map of seismic activity using all earthquakes recorded in the last 24 hours."/>
  <meta name="author" content="Alex Amor">
  <script type="speculationrules">
    {
      "prerender": [
        { "source": "list", "urls": ["/allday/", "/"] }
      ]
    }
  </script>
  <link rel="icon" href="./favicon.png" type="image/png"/>
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://d.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://earthquake.usgs.gov" crossorigin>
  <link rel="preload" href="../css/styles.css" as="style">
  <link rel="stylesheet" href="../css/styles.css"/>
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></noscript>
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script" crossorigin="anonymous">
  <link rel="preload" href="https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json" as="fetch" crossorigin="anonymous">
  <link rel="modulepreload" href="/js/quakeManager.js">
  <link rel="modulepreload" href="/js/soundEngine.js">
</head>
<body data-mode="allday">
  <div id="logo-overlay">
    <img src="../images/quakesound-logo.png"
         srcset="../images/quakesound-logo.png 1x, ../images/quakesound-logo-retina.png 2x"
         alt="QuakeSound Logo" />
  </div>
  <nav id="mode-switch" aria-label="Earthquake feed time range">
    <a href="/" class="mode-option" aria-label="Last Hour Earthquakes">Last Hour</a>
    <a href="/allday/" class="mode-option" aria-current="page" aria-label="Past Day Earthquakes">Past Day</a>
  </nav>
  <div id="map"></div>
  <div id="key-box">
    <div class="key-title">🎵 QuakeSound Key <span class="note">(click page for sound)</span></div>
    <div class="key-groups">
      <div class="key-group">
        <div class="key-row"><span class="key-k">Pitch</span><span class="key-v">Magnitude — higher note, bigger quake</span></div>
        <div class="key-row"><span class="key-k">Note length</span><span class="key-v">Depth — longer note, shallower quake</span></div>
      </div>
      <div class="key-group key-group--live">
        <div class="key-row"><span class="key-k">Quakes</span><span class="key-v"><span id="stat-total">0</span> loaded · max M<span id="stat-maxmag">—</span></span></div>
        <div class="key-row"><span class="key-k">Latest</span><span class="key-v" id="stat-lastplace">—</span></div>
        <div class="key-row"><span class="key-k">Activity</span><span id="quake-activity" class="quake-activity" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span></div>
      </div>
    </div>
    <div class="key-footer">
      <span class="key-version">v2.0</span>
      <a href="/v1/" class="key-archive-link">v1 archive ↗</a>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="anonymous"></script>
  <script type="module" src="../js/map.js"></script>
</body>
</html>
